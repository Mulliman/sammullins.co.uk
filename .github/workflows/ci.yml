# CI gates (tickets 801-805, 602). Every action is pinned to a full commit SHA (ticket 705).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run on main: GitHub evicts caches unused for 7 days, and this keeps the image cache warm
  # (and re-runs the dependency audit) during quiet weeks. Free on a public repo.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    # A build with a cold image cache generates ~1,500 image variants (~15 min on a hosted runner).
    # With the cache below, later builds take about a minute.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for "last changed" dates
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Astro's generated images (node_modules/.astro). Keyed on the masters and image config, with a
      # fallback to the latest cache so adding one photo only generates that photo's sizes.
      - name: Restore generated image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**', 'astro.config.mjs', 'src/components/Pic.astro', 'pnpm-lock.yaml') }}
          restore-keys: astro-images-
      - run: pnpm check
      - run: pnpm lint
      - name: Skills catalogue and .claude mirror are up to date
        run: node scripts/skills/block-catalogue.mjs --check && node scripts/skills/sync.mjs --check
      - run: pnpm build
      - run: pnpm test
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  links:
    name: Internal links
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --root-dir "${{ github.workspace }}/dist" --no-progress 'dist/**/*.html'
          fail: true

  a11y:
    name: Accessibility (axe, WCAG 2.2 AA)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y

  lighthouse:
    name: Lighthouse budgets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Ticket 804: budgets and pages are in lighthouserc.json. Reports are kept as an artifact.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-reports
