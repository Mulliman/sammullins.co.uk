# Weekly external link report (ticket 803). Non-blocking; opens or updates one issue. Never commits.
name: External links

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        id: lychee
        with:
          args: --config .github/lychee-external.toml --root-dir "${{ github.workspace }}" --no-progress --exclude-path _docs --exclude-path _tasks 'src/content/**/*.md'
          output: ./lychee-report.md
          fail: false
      # lychee skips github.com (see .github/lychee-external.toml); the API checks those links instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check github.com links through the GitHub API
        id: github
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/links/github-links.mjs github-links.md
      - name: Open or update the tracking issue
        if: steps.lychee.outputs.exit_code != 0 || steps.github.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat lychee-report.md github-links.md > report.md
          gh label create link-check --description "Weekly external link report" --color d73a4a --force
          n=$(gh issue list --label link-check --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file report.md
          else gh issue create --title "Broken external links" --label link-check --body-file report.md; fi
      - name: Close the tracking issue when every link passes
        if: steps.lychee.outputs.exit_code == 0 && steps.github.outputs.broken == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label link-check --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue close "$n" --comment "Every external link passed on ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."; fi
