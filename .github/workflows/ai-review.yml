# AI code review (ticket 807). Advisory: it comments and never blocks, so it is not a required check.
# Needs the ANTHROPIC_API_KEY repository secret; without it the job skips itself.
# Forks get no secrets, so it only runs for branches in this repo. Renovate PRs and drafts are skipped.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: API key set?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out. CI already runs types, lint,
            build, unit tests, axe, internal links, Lighthouse and CodeQL, so don't repeat those.
            Look for what they can't catch:
            - Bugs and logic errors in the diff.
            - Breaks of the golden rules in AGENTS.md (URLs, content vs code, authorship, CSP and
              accessibility, new dependencies, colour literals).
            - Security: anything that loosens headers, the CSP, workflow permissions or the supply chain.
            - Whether the change does what its ticket's acceptance criteria say (the ticket is linked in
              the PR body).

            Lead with a one-line verdict ("No blocking issues" or "N issues to fix"), then the
            findings, most serious first. Be brief; say nothing about style the linters own.
            Use `gh pr comment` for the summary and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            specific lines. Only post GitHub comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
