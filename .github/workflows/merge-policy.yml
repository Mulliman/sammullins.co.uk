# Merge policy (ticket 807): tier 0 and 1 changes pass; tier 2 waits for Sam's `sam-approved` label.
# The tiers are in scripts/merge-policy.mjs.
#
# pull_request_target runs this file and the script from the BASE branch, so a PR can't rewrite the
# policy that judges it. It never checks out or runs PR code, and its token is read-only.
name: Merge policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: merge-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Classify and enforce
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_APPROVERS: ${{ vars.MERGE_APPROVERS || 'Mulliman' }}
        run: node scripts/merge-policy.mjs --pr "$PR" --enforce
