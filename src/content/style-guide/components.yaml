# Style guide examples (ticket 1304), shown at /style-guide/components/.
#
# Each top-level key is one example. `title` is its heading on the page. Everything under `block:` is
# the YAML shown beside the rendered example, so write it the way a page author would. It is validated
# against the block schema in src/content.config.ts when the site builds.
#
# Image paths are relative to this file. It sits at the same depth as the pages in src/content/pages/,
# so a snippet pastes into a page unchanged.
#
# Every enum option of every block appears in at least one example.

hero-about:
  title: About hero, with facets to click through
  block:
    type: hero
    variant: about
    heading: A one-line statement about you
    subheading: A sentence or two on who you are and what you do now.
    ctas:
      - label: Primary action
        href: /software/
      - label: Secondary action
        href: /articles/
    now: what you're working on this month
    facets:
      - label: First side
        text: Two short sentences about this side of you. The first facet is the one shown on load.
        link:
          label: Where to read more
          href: /cv/
      - label: Second side
        text: Arrow keys move between facets, and without JavaScript every facet is listed.
      - label: Third side
        text: Between two and six facets, each label up to 24 characters.

