      - - type: callout
          tone: tip
          title: Narrow column
          body: The left column is a third of the width.
      - - type: quote
          text: The right column is two thirds of the width.

split-2-1:
  title: Ratio 2:1, reversed on mobile
  block:
    type: split
    ratio: "2:1"
    reverseOnMobile: true
    columns:
      - - type: prose
          align: left
          markdown: The wide column comes first on a desktop, and second on a phone.
      - - type: image
          image:
            src: ../../assets/demo/demo.jpg
            alt: Demo photo, a beach portrait
          width: content

section-none-default:
