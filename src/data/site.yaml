# Site-wide settings (ticket 103). Schema: src/content.config.ts → `settings`.
site:
  name: Sam Mullins
  tagline: Developer
  nav:
    - { label: Software, href: /software/ }
    - { label: Articles, href: /articles/ }
    - { label: CV, href: /cv/ }
  footerLinks:
    - { label: Archive, href: /archive/ }
  socials:
    - { label: GitHub, handle: Mulliman, href: 'https://github.com/Mulliman' }
    - { label: X, handle: _SamMullins_, href: 'https://x.com/_SamMullins_' }
    - { label: LinkedIn, handle: sam-mullins, href: 'https://www.linkedin.com/in/sam-mullins-31471425/' }
    # Bluesky: add once Sam confirms the handle (ticket 1202)
    # - { label: Bluesky, handle: "", href: "https://bsky.app/profile/" }
  # The footer boxes (509-symmetry): the logo, these two, then "Get in touch" from socials.
  footerCards:
    - title: What do I do?
      body: "I'm a web developer and Sitecore team lead. I build websites and applications in C# and TypeScript, and lately a lot of that is with AI coding agents. I also take photos."
    - title: Free stuff!
      body: 'Most of what I build outside work is free, and much of it is open source: Umbraco packages, Capture One plugins and games. [See my software](/software/), or browse the code on [GitHub](https://github.com/Mulliman).'
  # Ticket 703: GoatCounter site code. public/js/count.js must exist (the build checks); see _docs/analytics.md.
  analytics:
    goatcounter: sammullins
  # Ticket 905 prototypes: flip to true on a branch to preview, then decide ship / tweak / drop.
  features:
    # Ticket 211: false makes the masthead scroll away with the page instead of shrinking to a bar.
    stickyHeader: true
    blurToSharpHero: false
